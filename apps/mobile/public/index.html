<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover gives the safe-area insets to the page in iOS Safari and in the home screen app. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="application-name" content="Mona-DeFi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mona-DeFi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Coinbase fonts (licensed): served from /fonts/ by the server, not bundled. One family name per weight,
         the same names as src/theme.ts. "font-weight: 100 900" stops the browser from drawing a fake bold. -->
    <link rel="preload" href="/fonts/CoinbaseSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/CoinbaseSans-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/CoinbaseDisplay-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <style id="mona-fonts">
      @font-face { font-family: "CoinbaseSans-Regular"; src: url("/fonts/CoinbaseSans-Regular.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
      @font-face { font-family: "CoinbaseSans-Medium"; src: url("/fonts/CoinbaseSans-Medium.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
      @font-face { font-family: "CoinbaseSans-Bold"; src: url("/fonts/CoinbaseSans-Bold.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
      @font-face { font-family: "CoinbaseDisplay-Medium"; src: url("/fonts/CoinbaseDisplay-Medium.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
      @font-face { font-family: "CoinbaseDisplay-Bold"; src: url("/fonts/CoinbaseDisplay-Bold.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
      @font-face { font-family: "CoinbaseMono-Regular"; src: url("/fonts/CoinbaseMono-Regular.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
      @font-face { font-family: "CoinbaseMono-Medium"; src: url("/fonts/CoinbaseMono-Medium.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
    </style>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0B0D10;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Mona-DeFi.</noscript>
    <div id="root"></div>
  </body>
</html>
